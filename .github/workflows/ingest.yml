name: Ingest stock data

# 觸發時機
on:
  schedule:
    # cron 使用 UTC。00:00 UTC = 08:00 台灣時間。
    # 為什麼是「隔天早上」而非收盤當天傍晚：TWSE 的 STOCK_DAY_ALL OpenAPI 公布很晚，
    # 實測交易日 18:41 仍只有前一日資料；隔天早上（開盤前）兩市場的前一交易日資料才都穩定。
    # 2-6 = 週二到週六：抓週一~週五的收盤（週五資料在週六早上補齊）。
    # 每日抓兩次
    - cron: '0 0 * * 2-6'
    - cron: '0 12 * * 2-6'
  # 允許在 GitHub 網頁 Actions 分頁手動觸發，方便測試、不必等排程
  workflow_dispatch:

# 最小權限：這個 job 只讀程式碼，不需要寫回 repo
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: 安裝 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 執行擷取
        run: npm run ingest:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
